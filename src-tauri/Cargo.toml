[package]
name = "casper-xcloud"
version = "1.0.0"
description = "Casper xCloud"
authors = ["Casper"]
edition = "2024"

[lib]
name = "casper_xcloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
